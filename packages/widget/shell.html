<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Critical #4: default-src 'none' + allowlist explícita. img-src amplía
       'self' con NUESTRA CDN (res.nevent.es prod / res.dev.nevent.es dev) —
       ahí vive la foto real del agente (AgentAvatar, icons.tsx); AMBOS
       orígenes van SIEMPRE en la lista, no solo el del build actual, para no
       tener que parchear esta línea por entorno (mismo criterio que ya
       exige el comentario de connect-src, justo abajo). Sigue sin haber
       ningún <img> de un origen de TERCEROS — esa restricción (spec §8)
       sigue vigente, la que se levanta es solo para recursos propios.
       connect-src apunta al origen de producción; para dev local contra el
       mock-api o nev-api local hay que editar TAMBIÉN esta línea en el
       dist/shell.html generado, igual que ya se hace con la meta nevw-api
       (ver examples/README.md, Step 2 de esta tarea). frame-ancestors NO se
       puede fijar aquí — los navegadores ignoran esa directiva en un <meta>
       (solo aplica vía cabecera HTTP); el aislamiento de qué orígenes
       pueden embeber el widget lo hace el servidor validando
       embeddingOrigin contra la allowlist de la instalación (spec §4.1),
       no esta CSP. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://res.nevent.es https://res.dev.nevent.es; font-src 'self'; connect-src 'self' https://api.nevent.es; base-uri 'none'; object-src 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="nevw-api" content="https://api.nevent.es">
  <title>Chat de ayuda</title>
</head>
<body><div id="root"></div><script type="module" src="/src/shell/main.tsx"></script></body>
</html>

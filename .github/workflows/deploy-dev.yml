name: Deploy to Dev CDN

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: Deploy to dev.neventapps.com
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Build widget
        run: pnpm --filter @nevent/widget build

      - name: Generate SRI hashes
        run: pnpm run sri

      # El shell fija el origen de la API en dos sitios (meta nevw-api y CSP
      # connect-src); el build emite los defaults de producción, así que el
      # artefacto de dev se parchea aquí. La parametrización en build-time es
      # parte del Plan 4 (versionado CDN + SRI del widget).
      - name: Point widget shell at dev API
        run: |
          sed -i 's|https://api.nevent.es|https://api.dev.nevent.es|g' packages/widget/dist/shell.html
          grep -c "api.dev.nevent.es" packages/widget/dist/shell.html

      - name: Extract versions
        id: version
        run: |
          SUBS_VERSION=$(node -p "require('./packages/subscriptions/package.json').version")
          CHATBOT_VERSION=$(node -p "require('./packages/chatbot/package.json').version")
          echo "subs_version=$SUBS_VERSION" >> ${GITHUB_OUTPUT}
          echo "chatbot_version=$CHATBOT_VERSION" >> ${GITHUB_OUTPUT}
          echo "Extracted subscriptions version: $SUBS_VERSION"
          echo "Extracted chatbot version: $CHATBOT_VERSION"

      # ── Subscriptions SDK ────────────────────────────────────────────────────

      - name: Upload subscriptions to S3 (versioned path)
        run: |
          aws s3 sync packages/subscriptions/dist/ \
            s3://dev-nevent-sdks/subs/v${{ steps.version.outputs.subs_version }}/ \
            --region eu-west-1 \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload subscriptions to S3 (latest alias)
        run: |
          aws s3 sync packages/subscriptions/dist/ \
            s3://dev-nevent-sdks/subs/latest/ \
            --region eu-west-1 \
            --delete \
            --cache-control "public, max-age=300"

      # ── Chatbot SDK ──────────────────────────────────────────────────────────

      - name: Upload chatbot to S3 (versioned path)
        run: |
          aws s3 sync packages/chatbot/dist/ \
            s3://dev-nevent-sdks/chatbot/v${{ steps.version.outputs.chatbot_version }}/ \
            --region eu-west-1 \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload chatbot to S3 (latest alias)
        run: |
          aws s3 sync packages/chatbot/dist/ \
            s3://dev-nevent-sdks/chatbot/latest/ \
            --region eu-west-1 \
            --delete \
            --cache-control "public, max-age=300"

      # ── Widget (chat embebible) ──────────────────────────────────────────────
      # El snippet que emite nev-api (widget.embed.cdn-base-url) carga
      # {cdn}/widget/v1/loader.js, y el loader resuelve ./shell.html relativo a
      # su propio src — subir dist/ entero a widget/v1/ reproduce ese layout.
      # Ruta mutable en dev → cache corta, sin alias latest.

      - name: Upload widget to S3 (widget/v1)
        run: |
          aws s3 sync packages/widget/dist/ \
            s3://dev-nevent-sdks/widget/v1/ \
            --region eu-west-1 \
            --delete \
            --cache-control "public, max-age=300"

      # ── CloudFront Invalidation ──────────────────────────────────────────────

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DEV_DISTRIBUTION_ID }} \
            --paths "/subs/latest/*" "/chatbot/latest/*" "/widget/v1/*"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### @nevent/subscriptions v${{ steps.version.outputs.subs_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "https://dev.neventapps.com/subs/latest/nevent-subscriptions.js" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### @nevent/chatbot v${{ steps.version.outputs.chatbot_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "https://dev.neventapps.com/chatbot/latest/nevent-chatbot.js" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### @nevent/widget (chat embebible)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "https://dev.neventapps.com/widget/v1/loader.js" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "El snippet completo lo genera el admin en Chatbot → Canal web" >> $GITHUB_STEP_SUMMARY
          echo "(POST /admin/widget/installations/{id}/embed-code)." >> $GITHUB_STEP_SUMMARY

# Control de texto fijo (nevent-work#40) y presupuesto del chatbot (nevent-work#451, D21).
name: PR checks

on:
  pull_request:
    # ready_for_review: un draft que pasa a ready ejecuta la guarda una vez; los drafts se saltan abajo.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [development]
    paths:
      - 'packages/*/src/**'
      - 'packages/chatbot/**'
      - 'packages/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - 'scripts/widget-visible-text*'
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: read

# Un push nuevo al mismo PR sustituye al que esté corriendo.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  widget-visible-text:
    name: Texto fijo de los widgets
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/widget-visible-text.test.mjs

  chatbot-performance:
    name: Tamaño y carga de idiomas del chatbot
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:core
      - run: pnpm build:chatbot
      # Wall-clock benchmarks vary on shared runners. Run them locally with test:bench.
      - run: pnpm --filter @nevent/chatbot test:perf --minWorkers=1 --maxWorkers=2
        env:
          REQUIRE_CHATBOT_BUILD: '1'
      - run: pnpm exec vitest run --minWorkers=1 --maxWorkers=2 packages/chatbot/src/chatbot/__tests__/e2e/visitor-language.test.ts
